plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

def includeCompile(entry) {
    project.dependencies {
        modApi(entry)
        include(entry)
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	modCompileOnly ("net.caffeinemc:sodium-fabric:${sodium_version}") {
		exclude group: "net.fabricmc", module: "fabric-loader"
	}
	modCompileOnly "maven.modrinth:iris:${iris_version}-fabric"

	modCompileOnly("dev.ryanhcode.sable:sable-fabric-${project.minecraft_version}:${project.sable_version}") {
		exclude group: "net.fabricmc", module: "fabric-loader"
	}
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        data {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }

    }

    sourceSets {
        main {
            java {
                srcDir "src/main/datagen"
            }
            resources {
                srcDirs += [
                        project(":common").file("src/main/generated")
                ]
            }
        }
    }
}

tasks.register("traceFabricLoaderOrigins") {
	doLast {
		configurations.findAll { configuration ->
			configuration.canBeResolved &&
				(configuration.name.toLowerCase().contains("mod") ||
					configuration.name.toLowerCase().contains("runtime"))
		}.each { configuration ->
			try {
				def root = configuration.incoming.resolutionResult.rootComponent.get()
				def paths = []

				def visit
				visit = { component, path, seen ->
					component.dependencies.each { dependency ->
						if (!(dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult)) {
							return
						}

						def selected = dependency.selected
						def module = selected.moduleVersion
						def edge = "${dependency.requested.displayName} -> ${selected.id.displayName}"
						def nextPath = path + edge

						if (module?.group == "net.fabricmc" &&
							module.name == "fabric-loader") {
							paths << nextPath
							return
						}

						def nextSeen = new LinkedHashSet(seen)
						if (nextSeen.add(selected.id)) {
							visit(selected, nextPath, nextSeen)
						}
					}
				}

				visit(root, [], [root.id] as Set)

				if (!paths.empty) {
					println "\n=== ${configuration.name} ==="

					paths.each { path ->
						println path.collect { "  ${it}" }.join("\n")
						println()
					}
				}
			} catch (Exception ignored) {
				// Some Loom configurations cannot be resolved independently.
			}
		}
	}
}
